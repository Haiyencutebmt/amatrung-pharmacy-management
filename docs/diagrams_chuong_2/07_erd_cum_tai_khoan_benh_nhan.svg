<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-labelledby="title desc">
  <title id="title">Cụm tài khoản và bệnh nhân</title>
  <desc id="desc">Sơ đồ tách riêng gồm users, patients và patient_user_links.</desc>
  <rect width="1000" height="980" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    .panel { fill: #eef2ff; stroke: #4f46e5; stroke-width: 4; }
    .table { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
    .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
    .tableName { font: 700 28px Arial, sans-serif; fill: #0f172a; }
    .field { font: 400 24px Arial, sans-serif; fill: #172033; }
    .line { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .label { font: 700 22px Arial, sans-serif; fill: #0f172a; paint-order: stroke; stroke: #ffffff; stroke-width: 6; }
  </style>

  <rect class="panel" x="40" y="30" width="920" height="910" rx="24"/>
  <text class="title" x="90" y="90">Bên trái: tài khoản và bệnh nhân</text>

  <!-- users -->
  <rect class="table" x="230" y="180" width="540" height="155" rx="14"/>
  <text class="tableName" x="500" y="222" text-anchor="middle">users</text>
  <text class="field" x="265" y="266">PK: id</text>
  <text class="field" x="265" y="301">name, role</text>
  <text class="field" x="265" y="326">is_active</text>

  <!-- patients -->
  <rect class="table" x="230" y="455" width="540" height="180" rx="14"/>
  <text class="tableName" x="500" y="497" text-anchor="middle">patients</text>
  <text class="field" x="265" y="541">PK: id</text>
  <text class="field" x="265" y="576">FK: user_id</text>
  <text class="field" x="265" y="611">patient_code, full_name</text>
  <text class="field" x="265" y="626">phone</text>

  <!-- patient_user_links -->
  <rect class="table" x="230" y="755" width="540" height="155" rx="14"/>
  <text class="tableName" x="500" y="797" text-anchor="middle">patient_user_links</text>
  <text class="field" x="265" y="841">FK: user_id, patient_id</text>
  <text class="field" x="265" y="876">relationship_type</text>
  <text class="field" x="265" y="901">is_verified</text>

  <!-- relationships -->
  <path class="line" d="M500 335 L500 455"/>
  <text class="label" x="522" y="407">1-N nếu có user_id</text>

  <path class="line" d="M360 335 L360 755"/>
  <text class="label" x="96" y="555">N-N qua liên kết</text>

  <path class="line" d="M640 635 L640 755"/>
  <text class="label" x="662" y="705">N-N qua liên kết</text>
</svg>
