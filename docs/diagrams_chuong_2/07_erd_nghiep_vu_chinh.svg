<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1650" viewBox="0 0 3000 1650" role="img" aria-labelledby="title desc">
  <title id="title">Hình 2.8. Mô hình quan hệ dữ liệu nghiệp vụ chính của website quản lý nhà thuốc y học cổ truyền AmaTrung</title>
  <desc id="desc">Sơ đồ ERD nghiệp vụ chính gồm users, patients, medical_records, prescriptions, inventory_items, inventory_batches, stock_movements, appointments và ai_suggestion_logs.</desc>
  <rect width="3000" height="1650" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-soft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 38px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 22px Arial, sans-serif; fill: #475569; }
    .group { stroke-width: 3; rx: 18; }
    .groupTitle { font: 700 25px Arial, sans-serif; fill: #0f172a; }
    .table { fill: #ffffff; stroke: #334155; stroke-width: 2.1; rx: 10; }
    .tableName { font: 700 22px Arial, sans-serif; fill: #0f172a; }
    .field { font: 400 18px Arial, sans-serif; fill: #334155; }
    .rel { stroke: #334155; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    .relSoft { stroke: #64748b; stroke-width: 2.1; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-soft); }
    .relLabel { font: 700 17px Arial, sans-serif; fill: #0f172a; paint-order: stroke; stroke: #ffffff; stroke-width: 5; }
    .noteBox { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; rx: 14; }
    .noteTitle { font: 700 24px Arial, sans-serif; fill: #0f172a; }
    .noteText { font: 400 21px Arial, sans-serif; fill: #1f2937; }
    .caption { font: 700 24px Arial, sans-serif; fill: #0f172a; }
  </style>

  <text class="title" x="1500" y="64" text-anchor="middle">Hình 2.8. Mô hình quan hệ dữ liệu nghiệp vụ chính của website quản lý nhà thuốc YHCT AmaTrung</text>
  <text class="subtitle" x="1500" y="102" text-anchor="middle">Phạm vi: bệnh nhân, bệnh án, đơn điều trị, kho dược liệu theo lô, lịch hẹn và nhật ký AI</text>

  <!-- Group panels -->
  <rect class="group" x="50" y="150" width="560" height="970" fill="#eef2ff" stroke="#4f46e5"/>
  <text class="groupTitle" x="80" y="195">Bên trái: tài khoản và bệnh nhân</text>

  <rect class="group" x="690" y="150" width="620" height="970" fill="#ecfdf5" stroke="#059669"/>
  <text class="groupTitle" x="720" y="195">Giữa: bệnh án, lịch hẹn và AI</text>

  <rect class="group" x="1390" y="150" width="610" height="970" fill="#fff7ed" stroke="#ea580c"/>
  <text class="groupTitle" x="1420" y="195">Bên phải: đơn điều trị và dịch vụ</text>

  <rect class="group" x="2080" y="150" width="790" height="970" fill="#eff6ff" stroke="#2563eb"/>
  <text class="groupTitle" x="2110" y="195">Xa bên phải: kho dược liệu theo lô</text>

  <!-- Left: users and patients -->
  <g transform="translate(145 280)">
    <rect class="table" width="360" height="130"/>
    <text class="tableName" x="180" y="34" text-anchor="middle">users</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">name, role</text>
    <text class="field" x="20" y="120">is_active</text>
  </g>

  <g transform="translate(145 535)">
    <rect class="table" width="360" height="145"/>
    <text class="tableName" x="180" y="34" text-anchor="middle">patients</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: user_id</text>
    <text class="field" x="20" y="120">patient_code, full_name</text>
    <text class="field" x="20" y="140">phone</text>
  </g>

  <g transform="translate(145 820)">
    <rect class="table" width="360" height="130"/>
    <text class="tableName" x="180" y="34" text-anchor="middle">patient_user_links</text>
    <text class="field" x="20" y="66">FK: user_id, patient_id</text>
    <text class="field" x="20" y="94">relationship_type</text>
    <text class="field" x="20" y="120">is_verified</text>
  </g>

  <!-- Middle: medical records -->
  <g transform="translate(800 455)">
    <rect class="table" width="400" height="165"/>
    <text class="tableName" x="200" y="34" text-anchor="middle">medical_records</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: patient_id, staff_id</text>
    <text class="field" x="20" y="120">record_code, symptoms</text>
    <text class="field" x="20" y="145">diagnosis, status</text>
  </g>

  <g transform="translate(800 245)">
    <rect class="table" width="400" height="125"/>
    <text class="tableName" x="200" y="34" text-anchor="middle">medical_record_attachments</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: medical_record_id</text>
    <text class="field" x="20" y="118">file_name, file_path</text>
  </g>

  <g transform="translate(800 720)">
    <rect class="table" width="400" height="125"/>
    <text class="tableName" x="200" y="34" text-anchor="middle">appointments</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: patient_id</text>
    <text class="field" x="20" y="118">date, time, status</text>
  </g>

  <g transform="translate(800 920)">
    <rect class="table" width="400" height="130"/>
    <text class="tableName" x="200" y="34" text-anchor="middle">ai_suggestion_logs</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: user_id, medical_record_id</text>
    <text class="field" x="20" y="120">payload, response, status</text>
  </g>

  <!-- Right: prescriptions -->
  <g transform="translate(1490 455)">
    <rect class="table" width="410" height="140"/>
    <text class="tableName" x="205" y="34" text-anchor="middle">prescriptions</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: medical_record_id, staff_id</text>
    <text class="field" x="20" y="120">treatment_type, status</text>
  </g>

  <g transform="translate(1490 745)">
    <rect class="table" width="410" height="155"/>
    <text class="tableName" x="205" y="34" text-anchor="middle">prescription_items</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: prescription_id</text>
    <text class="field" x="20" y="120">FK: inventory_item_id</text>
    <text class="field" x="20" y="145">item_type, quantity, affects_stock</text>
  </g>

  <g transform="translate(1490 985)">
    <rect class="table" width="410" height="120"/>
    <text class="tableName" x="205" y="34" text-anchor="middle">therapy_services</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">name, default_sessions</text>
    <text class="field" x="20" y="115">status</text>
  </g>

  <!-- Far right: inventory -->
  <g transform="translate(2250 420)">
    <rect class="table" width="420" height="140"/>
    <text class="tableName" x="210" y="34" text-anchor="middle">inventory_items</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">name, item_type</text>
    <text class="field" x="20" y="120">usage_route, unit</text>
  </g>

  <g transform="translate(2250 680)">
    <rect class="table" width="420" height="140"/>
    <text class="tableName" x="210" y="34" text-anchor="middle">inventory_batches</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: inventory_item_id</text>
    <text class="field" x="20" y="120">batch_number, expiry_date</text>
  </g>

  <g transform="translate(2250 940)">
    <rect class="table" width="420" height="150"/>
    <text class="tableName" x="210" y="34" text-anchor="middle">stock_movements</text>
    <text class="field" x="20" y="66">PK: id</text>
    <text class="field" x="20" y="94">FK: inventory_batch_id</text>
    <text class="field" x="20" y="120">FK: prescription_item_id</text>
    <text class="field" x="20" y="145">performed_by, quantity</text>
  </g>

  <!-- Relationships: left group -->
  <path class="rel" d="M325 410 L325 535"/>
  <text class="relLabel" x="340" y="478">1-N nếu có user_id</text>

  <path class="rel" d="M230 410 L230 820"/>
  <text class="relLabel" x="78" y="620">N-N qua liên kết</text>

  <path class="rel" d="M325 680 L325 820"/>
  <text class="relLabel" x="340" y="760">N-N qua liên kết</text>

  <!-- Patients to middle -->
  <path class="rel" d="M505 600 H650 V520 H800"/>
  <text class="relLabel" x="615" y="500">1-N medical_records</text>

  <path class="rel" d="M505 650 H650 V785 H800"/>
  <text class="relLabel" x="612" y="770">1-N appointments</text>

  <!-- Medical records internal -->
  <path class="rel" d="M1000 455 V370"/>
  <text class="relLabel" x="1015" y="420">1-N</text>

  <path class="rel" d="M1000 620 V920"/>
  <text class="relLabel" x="1015" y="890">1-N AI log</text>

  <!-- Medical records to prescriptions -->
  <path class="rel" d="M1200 530 H1490"/>
  <text class="relLabel" x="1298" y="508">1-N prescriptions</text>

  <!-- Prescriptions to items -->
  <path class="rel" d="M1695 595 V745"/>
  <text class="relLabel" x="1710" y="690">1-N</text>

  <!-- Therapy to items -->
  <path class="relSoft" d="M1695 985 V900"/>
  <text class="relLabel" x="1710" y="955">danh mục dịch vụ</text>

  <!-- Inventory relations -->
  <path class="rel" d="M2250 500 H2035 V820 H1900"/>
  <text class="relLabel" x="2048" y="795">1-N prescription_items</text>

  <path class="rel" d="M2460 560 V680"/>
  <text class="relLabel" x="2475" y="630">1-N</text>

  <path class="rel" d="M2460 820 V940"/>
  <text class="relLabel" x="2475" y="890">1-N</text>

  <path class="rel" d="M1900 850 H2140 V1015 H2250"/>
  <text class="relLabel" x="2005" y="995">0-N stock_movements</text>

  <!-- User to AI and stock movements -->
  <path class="relSoft" d="M505 345 H650 V985 H800"/>
  <text class="relLabel" x="575" y="965">users 1-N AI logs</text>

  <path class="relSoft" d="M505 370 H615 V1135 H2180 V1015 H2250"/>
  <text class="relLabel" x="1940" y="1115">users 1-N performed_by</text>

  <!-- Note -->
  <rect class="noteBox" x="60" y="1260" width="2810" height="230"/>
  <text class="noteTitle" x="100" y="1302">Ghi chú dưới hình</text>
  <text class="noteText" x="100" y="1344">• Admin/Thầy thuốc chính là người quyết định chuyên môn; Staff là nhân viên được Admin cấp quyền.</text>
  <text class="noteText" x="100" y="1384">• AI chỉ lưu nhật ký hỗ trợ tham khảo, không tự tạo đơn và không tự trừ kho.</text>
  <text class="noteText" x="100" y="1424">• Kho chính sử dụng `inventory_items`, `inventory_batches`, `stock_movements`.</text>
  <text class="caption" x="1500" y="1560" text-anchor="middle">Hình 2.8. Mô hình quan hệ dữ liệu nghiệp vụ chính của website quản lý nhà thuốc y học cổ truyền AmaTrung</text>
</svg>
