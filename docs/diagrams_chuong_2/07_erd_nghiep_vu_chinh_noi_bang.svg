    <text class="key" x="14" y="110">FK</text>
    <text class="cell" x="64" y="110">medical_record_id</text>
    <text class="cell" x="64" y="142">staff_id</text>
    <text class="cell" x="64" y="174">treatment_type</text>
    <text class="cell" x="64" y="206">status</text>
  </g>

