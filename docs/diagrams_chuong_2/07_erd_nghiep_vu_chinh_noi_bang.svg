    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="64" y="70">id</text>
    <text class="key" x="14" y="110">FK</text>
    <text class="cell" x="64" y="110">prescription_id</text>
    <text class="key" x="14" y="142">FK</text>
    <text class="cell" x="64" y="142">inventory_item_id</text>
    <text class="cell" x="64" y="174">item_type</text>
    <text class="cell" x="64" y="206">quantity</text>
    <text class="cell" x="64" y="238">affects_stock</text>
  </g>

  <!-- therapy_services -->
  <g id="therapy_services" transform="translate(980 1010)">
    <rect class="table" width="270" height="180"/>
    <line class="row" x1="0" y1="45" x2="270" y2="45"/>
    <line class="row" x1="0" y1="85" x2="270" y2="85"/>
    <line class="col" x1="50" y1="45" x2="50" y2="180"/>
    <text class="tableName" x="135" y="30" text-anchor="middle">therapy_services</text>
    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="64" y="70">id</text>
    <text class="cell" x="64" y="110">name</text>
    <text class="cell" x="64" y="142">default_sessions</text>
