    <text class="key" x="14" y="142">FK</text>
    <text class="cell" x="64" y="142">prescription_item_id</text>
    <text class="cell" x="64" y="174">performed_by</text>
    <text class="cell" x="64" y="206">movement_type</text>
    <text class="cell" x="64" y="238">quantity</text>
