  <g id="prescription_items" transform="translate(980 680)">
    <rect class="table" width="290" height="260"/>
    <line class="row" x1="0" y1="45" x2="290" y2="45"/>
    <line class="row" x1="0" y1="85" x2="290" y2="85"/>
    <line class="col" x1="50" y1="45" x2="50" y2="260"/>
