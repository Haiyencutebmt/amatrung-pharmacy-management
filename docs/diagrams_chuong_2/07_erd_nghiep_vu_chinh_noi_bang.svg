  <!-- Relationship lines -->
  <path class="rel" d="M245 285 V355"/>
  <text class="label" x="270" y="330">1-N nếu có user_id</text>

  <path class="rel" d="M110 205 H82 V810 H110"/>
  <text class="label" x="76" y="655">N-N qua liên kết</text>

  <path class="rel" d="M380 555 H410 V805 H380"/>
  <text class="label" x="360" y="675">N-N qua liên kết</text>

  <path class="rel" d="M380 465 H445 V525 H515"/>
  <text class="label" x="392" y="448">1-N medical_records</text>

  <path class="rel" d="M380 545 H445 V830 H515"/>
  <text class="label" x="392" y="813">1-N appointments</text>

  <path class="rel" d="M680 390 V305"/>
  <text class="label" x="700" y="355">1-N attachments</text>

  <path class="rel" d="M845 525 H980"/>
  <text class="label" x="870" y="508">1-N prescriptions</text>

  <path class="rel" d="M845 620 H875 V1135 H845"/>
  <text class="label" x="710" y="985">1-N AI logs</text>

  <path class="relSoft" d="M380 205 H445 V1110 H515"/>
  <text class="label" x="395" y="1092">users 1-N AI logs</text>

  <path class="rel" d="M1115 580 V680"/>
  <text class="label" x="1135" y="640">1-N</text>

  <path class="relSoft" d="M1115 1010 V940"/>
  <text class="label" x="1135" y="985">danh mục dịch vụ</text>

  <path class="rel" d="M1400 460 H1328 V810 H1270"/>
  <text class="label" x="1280" y="790">inventory_items 1-N prescription_items</text>

  <path class="rel" d="M1545 580 V670"/>
  <text class="label" x="1565" y="630">1-N batches</text>

  <path class="rel" d="M1550 900 V1010"/>
  <text class="label" x="1570" y="970">1-N movements</text>

  <path class="rel" d="M1270 820 H1345 V1135 H1400"/>
  <text class="label" x="1285" y="1116">0-N stock_movements</text>

  <path class="relSoft" d="M380 230 H420 V1340 H1360 V1135 H1400"/>
  <text class="label" x="1195" y="1320">users 1-N performed_by</text>

  <text class="note" x="70" y="1365">Ghi chú: đường liền là quan hệ chính; đường nét đứt là quan hệ người thao tác/tham chiếu nghiệp vụ. AI chỉ lưu log tham khảo, không tự tạo đơn và không tự trừ kho.</text>
</svg>
