    <line class="row" x1="0" y1="45" x2="290" y2="45"/>
    <line class="row" x1="0" y1="85" x2="290" y2="85"/>
    <line class="col" x1="50" y1="45" x2="50" y2="230"/>
    <text class="tableName" x="145" y="30" text-anchor="middle">inventory_items</text>
    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="64" y="70">id</text>
    <text class="cell" x="64" y="110">name</text>
    <text class="cell" x="64" y="142">item_type</text>
    <text class="cell" x="64" y="174">usage_route</text>
