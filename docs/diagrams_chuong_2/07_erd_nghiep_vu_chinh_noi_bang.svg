    <line class="col" x1="50" y1="45" x2="50" y2="210"/>
    <text class="tableName" x="165" y="30" text-anchor="middle">appointments</text>
    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="64" y="70">id</text>
    <text class="key" x="14" y="110">FK</text>
    <text class="cell" x="64" y="110">patient_id</text>
    <text class="cell" x="64" y="142">appointment_date</text>
    <text class="cell" x="64" y="174">appointment_time</text>
    <text class="cell" x="64" y="202">status</text>
