    <line class="col" x1="50" y1="45" x2="50" y2="190"/>
    <text class="tableName" x="165" y="30" text-anchor="middle">medical_record_attachments</text>
    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="64" y="70">id</text>
    <text class="key" x="14" y="110">FK</text>
    <text class="cell" x="64" y="110">medical_record_id</text>
    <text class="cell" x="64" y="145">file_name</text>
    <text class="cell" x="64" y="178">file_path</text>
  </g>

  <!-- medical_records -->
  <g id="medical_records" transform="translate(515 390)">
    <rect class="table" width="330" height="275"/>
    <line class="row" x1="0" y1="45" x2="330" y2="45"/>
    <line class="row" x1="0" y1="85" x2="330" y2="85"/>
    <line class="col" x1="50" y1="45" x2="50" y2="275"/>
    <text class="tableName" x="165" y="30" text-anchor="middle">medical_records</text>
    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="64" y="70">id</text>
    <text class="key" x="14" y="110">FK</text>
    <text class="cell" x="64" y="110">patient_id</text>
    <text class="cell" x="64" y="142">staff_id</text>
    <text class="cell" x="64" y="174">record_code</text>
    <text class="cell" x="64" y="206">symptoms</text>
    <text class="cell" x="64" y="238">diagnosis</text>
    <text class="cell" x="64" y="266">status</text>
  </g>

  <!-- appointments -->
  <g id="appointments" transform="translate(515 725)">
