<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
  <title id="title">Bản nối bảng ERD nghiệp vụ chính AmaTrung</title>
  <desc id="desc">Sơ đồ nối các bảng nghiệp vụ chính gồm users, patients, medical_records, prescriptions, inventory và ai logs.</desc>
  <rect width="1800" height="1420" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#26364a"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .group { fill: #ffffff; stroke: #334155; stroke-width: 1.8; stroke-dasharray: 9 8; }
    .groupTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; text-decoration: underline; }
    .table { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
    .row { stroke: #111827; stroke-width: 1.1; }
    .col { stroke: #111827; stroke-width: 1.1; }
    .tableName { font: 700 20px Arial, sans-serif; fill: #000000; }
    .cell { font: 400 18px Arial, sans-serif; fill: #000000; }
    .key { font: 700 16px Arial, sans-serif; fill: #000000; }
    .rel { stroke: #26364a; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    .relSoft { stroke: #64748b; stroke-width: 2.1; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrowSoft); }
    .label { font: 700 16px Arial, sans-serif; fill: #000000; paint-order: stroke; stroke: #ffffff; stroke-width: 5; }
    .note { font: 400 17px Arial, sans-serif; fill: #334155; }
  </style>

  <!-- Group boxes -->
  <rect class="group" x="60" y="70" width="370" height="1060"/>
  <text class="groupTitle" x="150" y="52">tài khoản và bệnh nhân</text>

  <rect class="group" x="465" y="70" width="430" height="1240"/>
  <text class="groupTitle" x="560" y="52">bệnh án, lịch hẹn và AI</text>

  <rect class="group" x="930" y="300" width="360" height="880"/>
  <text class="groupTitle" x="980" y="282">đơn điều trị và dịch vụ</text>

  <rect class="group" x="1360" y="300" width="390" height="910"/>
  <text class="groupTitle" x="1450" y="282">kho dược liệu theo lô</text>

  <!-- users -->
  <g id="users" transform="translate(110 115)">
    <rect class="table" width="270" height="170"/>
    <line class="row" x1="0" y1="45" x2="270" y2="45"/>
    <line class="row" x1="0" y1="85" x2="270" y2="85"/>
    <line class="col" x1="48" y1="45" x2="48" y2="170"/>
    <text class="tableName" x="135" y="30" text-anchor="middle">users</text>
    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="62" y="70">id</text>
    <text class="cell" x="62" y="112">name</text>
    <text class="cell" x="62" y="140">role</text>
    <text class="cell" x="62" y="164">is_active</text>
  </g>

  <!-- patients -->
  <g id="patients" transform="translate(110 355)">
    <rect class="table" width="270" height="230"/>
    <line class="row" x1="0" y1="45" x2="270" y2="45"/>
    <line class="row" x1="0" y1="85" x2="270" y2="85"/>
    <line class="col" x1="48" y1="45" x2="48" y2="230"/>
    <text class="tableName" x="135" y="30" text-anchor="middle">patients</text>
    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="62" y="70">id</text>
    <text class="key" x="14" y="110">FK</text>
    <text class="cell" x="62" y="110">user_id</text>
    <text class="cell" x="62" y="142">patient_code</text>
    <text class="cell" x="62" y="174">full_name</text>
    <text class="cell" x="62" y="206">phone</text>
  </g>

  <!-- patient_user_links -->
  <g id="patient_user_links" transform="translate(110 705)">
    <rect class="table" width="270" height="210"/>
    <line class="row" x1="0" y1="45" x2="270" y2="45"/>
    <line class="row" x1="0" y1="85" x2="270" y2="85"/>
    <line class="col" x1="48" y1="45" x2="48" y2="210"/>
    <text class="tableName" x="135" y="30" text-anchor="middle">patient_user_links</text>
    <text class="key" x="14" y="110">FK</text>
    <text class="cell" x="62" y="110">user_id</text>
    <text class="cell" x="62" y="142">patient_id</text>
    <text class="cell" x="62" y="174">relationship_type</text>
