  <!-- inventory_batches -->
  <g id="inventory_batches" transform="translate(1400 670)">
    <rect class="table" width="300" height="230"/>
    <line class="row" x1="0" y1="45" x2="300" y2="45"/>
    <line class="row" x1="0" y1="85" x2="300" y2="85"/>
    <line class="col" x1="50" y1="45" x2="50" y2="230"/>
