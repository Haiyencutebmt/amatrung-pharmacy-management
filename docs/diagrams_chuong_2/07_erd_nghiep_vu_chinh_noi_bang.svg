    <text class="key" x="14" y="70">PK</text>
    <text class="cell" x="64" y="70">id</text>
    <text class="key" x="14" y="110">FK</text>
    <text class="cell" x="64" y="110">user_id</text>
    <text class="cell" x="64" y="142">medical_record_id</text>
    <text class="cell" x="64" y="174">payload</text>
    <text class="cell" x="64" y="206">response</text>
    <text class="cell" x="64" y="238">status</text>
  </g>

  <!-- prescriptions -->
  <g id="prescriptions" transform="translate(980 350)">
    <rect class="table" width="270" height="230"/>
    <line class="row" x1="0" y1="45" x2="270" y2="45"/>
    <line class="row" x1="0" y1="85" x2="270" y2="85"/>
    <line class="col" x1="50" y1="45" x2="50" y2="230"/>
    <text class="tableName" x="135" y="30" text-anchor="middle">prescriptions</text>
    <text class="key" x="14" y="70">PK</text>
