    <rect class="table" width="310" height="250"/>
    <line class="row" x1="0" y1="45" x2="310" y2="45"/>
    <line class="row" x1="0" y1="85" x2="310" y2="85"/>
    <line class="col" x1="50" y1="45" x2="50" y2="250"/>
