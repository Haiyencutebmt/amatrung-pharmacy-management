  <!-- ai_suggestion_logs -->
  <g id="ai_suggestion_logs" transform="translate(515 1010)">
    <rect class="table" width="330" height="250"/>
    <line class="row" x1="0" y1="45" x2="330" y2="45"/>
    <line class="row" x1="0" y1="85" x2="330" y2="85"/>
    <line class="col" x1="50" y1="45" x2="50" y2="250"/>
