    <text class="cell" x="64" y="110">inventory_item_id</text>
    <text class="cell" x="64" y="142">batch_number</text>
    <text class="cell" x="64" y="174">quantity_remaining</text>
    <text class="cell" x="64" y="206">expiry_date</text>
  </g>

