<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
  <title id="title">ERD nghiệp vụ chính AmaTrung - bản nối bảng rõ nét</title>
  <desc id="desc">Bản vẽ lại theo bố cục người dùng cung cấp, các đường nối đi ngoài vùng chữ của bảng.</desc>
  <rect width="1800" height="1500" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#111827"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <style>
    .group { fill: none; stroke: #111827; stroke-width: 1.8; stroke-dasharray: 8 7; }
    .groupTitle { font: 700 22px Arial, sans-serif; fill: #000000; text-decoration: underline; }
    .table { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .row { stroke: #000000; stroke-width: 1.4; }
    .col { stroke: #000000; stroke-width: 1.4; }
    .tableName { font: 700 22px Arial, sans-serif; fill: #000000; }
    .cell { font: 400 21px Arial, sans-serif; fill: #000000; }
    .key { font: 700 18px Arial, sans-serif; fill: #000000; }
    .rel { stroke: #111827; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .relSoft { stroke: #475569; stroke-width: 2.8; fill: none; stroke-dasharray: 9 7; marker-end: url(#arrowSoft); }
    .label { font: 700 17px Arial, sans-serif; fill: #000000; paint-order: stroke; stroke: #ffffff; stroke-width: 6; }
    .note { font: 400 18px Arial, sans-serif; fill: #334155; }
  </style>

  <!-- Group frames -->
  <rect class="group" x="28" y="70" width="345" height="1060"/>
  <text class="groupTitle" x="78" y="45">tài khoản và bệnh nhân</text>

  <rect class="group" x="455" y="60" width="445" height="1275"/>
  <text class="groupTitle" x="545" y="45">bệnh án, lịch hẹn và AI</text>

  <rect class="group" x="940" y="315" width="380" height="885"/>
  <text class="groupTitle" x="980" y="295">đơn điều trị và dịch vụ</text>

  <rect class="group" x="1360" y="315" width="405" height="910"/>
  <text class="groupTitle" x="1450" y="295">kho dược liệu theo lô</text>

  <!-- users -->
