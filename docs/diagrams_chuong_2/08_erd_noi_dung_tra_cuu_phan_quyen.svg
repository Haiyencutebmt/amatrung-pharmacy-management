<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1700" viewBox="0 0 3000 1700" role="img" aria-labelledby="title desc">
  <title id="title">Hình 2.9. Mô hình quan hệ dữ liệu phần nội dung, tra cứu và phân quyền của website quản lý nhà thuốc y học cổ truyền AmaTrung</title>
  <desc id="desc">Sơ đồ gồm tài khoản phân quyền, bài viết bình luận, từ điển dược liệu và liên hệ yêu cầu hỗ trợ.</desc>
  <rect width="3000" height="1700" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#26364a"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .title { font: 700 36px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 21px Arial, sans-serif; fill: #475569; }
    .group { stroke-width: 3; rx: 18; }
    .groupTitle { font: 700 25px Arial, sans-serif; fill: #0f172a; }
    .table { fill: #ffffff; stroke: #334155; stroke-width: 2.1; rx: 10; }
    .tableName { font: 700 21px Arial, sans-serif; fill: #0f172a; }
    .field { font: 400 18px Arial, sans-serif; fill: #334155; }
    .rel { stroke: #26364a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
    .relSoft { stroke: #64748b; stroke-width: 2.1; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrowSoft); }
    .label { font: 700 16px Arial, sans-serif; fill: #0f172a; paint-order: stroke; stroke: #ffffff; stroke-width: 5; }
    .noteBox { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 6; rx: 14; }
    .noteTitle { font: 700 24px Arial, sans-serif; fill: #0f172a; }
    .noteText { font: 400 20px Arial, sans-serif; fill: #1f2937; }
    .caption { font: 700 23px Arial, sans-serif; fill: #0f172a; }
  </style>

  <text class="title" x="1500" y="62" text-anchor="middle">Hình 2.9. Mô hình quan hệ dữ liệu phần nội dung, tra cứu và phân quyền của website AmaTrung</text>
  <text class="subtitle" x="1500" y="100" text-anchor="middle">Phạm vi: tài khoản và phân quyền, bài viết/bình luận/lượt thích, từ điển dược liệu, liên hệ/yêu cầu hỗ trợ</text>

  <!-- Group frames -->
  <rect class="group" x="55" y="150" width="900" height="950" fill="#eef2ff" stroke="#4f46e5"/>
  <text class="groupTitle" x="90" y="195">Cụm 1: Tài khoản và phân quyền</text>

  <rect class="group" x="1030" y="150" width="860" height="420" fill="#fdf2f8" stroke="#db2777"/>
  <text class="groupTitle" x="1065" y="195">Cụm 2: Bài viết và bình luận</text>

  <rect class="group" x="1030" y="650" width="860" height="450" fill="#f0fdfa" stroke="#0f766e"/>
  <text class="groupTitle" x="1065" y="695">Cụm 3: Từ điển dược liệu</text>

  <rect class="group" x="1990" y="150" width="650" height="420" fill="#fff7ed" stroke="#ea580c"/>
  <text class="groupTitle" x="2025" y="195">Cụm 4: Liên hệ/yêu cầu hỗ trợ</text>

  <!-- Account and permission tables -->
  <g transform="translate(350 255)">
    <rect class="table" width="260" height="130"/>
    <text class="tableName" x="130" y="34" text-anchor="middle">users</text>
    <text class="field" x="18" y="66">PK: id</text>
    <text class="field" x="18" y="94">name, email, phone</text>
    <text class="field" x="18" y="120">role</text>
  </g>

  <g transform="translate(130 505)">
    <rect class="table" width="250" height="115"/>
    <text class="tableName" x="125" y="34" text-anchor="middle">roles</text>
    <text class="field" x="18" y="66">PK: id</text>
    <text class="field" x="18" y="94">name, guard_name</text>
  </g>

  <g transform="translate(630 505)">
    <rect class="table" width="270" height="115"/>
    <text class="tableName" x="135" y="34" text-anchor="middle">permissions</text>
    <text class="field" x="18" y="66">PK: id</text>
    <text class="field" x="18" y="94">name, guard_name</text>
  </g>

  <g transform="translate(115 740)">
    <rect class="table" width="310" height="125"/>
    <text class="tableName" x="155" y="34" text-anchor="middle">model_has_roles</text>
    <text class="field" x="18" y="66">FK: role_id</text>
    <text class="field" x="18" y="94">model_id, model_type</text>
    <text class="field" x="18" y="118">pivot User - Role</text>
  </g>

  <g transform="translate(555 740)">
    <rect class="table" width="350" height="125"/>
    <text class="tableName" x="175" y="34" text-anchor="middle">model_has_permissions</text>
    <text class="field" x="18" y="66">FK: permission_id</text>
    <text class="field" x="18" y="94">model_id, model_type</text>
    <text class="field" x="18" y="118">pivot User - Permission</text>
  </g>

  <g transform="translate(315 930)">
    <rect class="table" width="330" height="115"/>
    <text class="tableName" x="165" y="34" text-anchor="middle">role_has_permissions</text>
    <text class="field" x="18" y="66">FK: role_id</text>
    <text class="field" x="18" y="94">FK: permission_id</text>
  </g>

  <!-- Content tables -->
  <g transform="translate(1100 260)">
    <rect class="table" width="300" height="130"/>
    <text class="tableName" x="150" y="34" text-anchor="middle">articles</text>
    <text class="field" x="18" y="66">PK: id, FK: user_id</text>
    <text class="field" x="18" y="94">title, slug</text>
    <text class="field" x="18" y="120">is_published</text>
  </g>

  <g transform="translate(1510 210)">
    <rect class="table" width="310" height="130"/>
    <text class="tableName" x="155" y="34" text-anchor="middle">comments</text>
    <text class="field" x="18" y="66">PK: id</text>
    <text class="field" x="18" y="94">FK: article_id, user_id</text>
    <text class="field" x="18" y="120">content, is_approved</text>
  </g>

  <g transform="translate(1510 380)">
    <rect class="table" width="310" height="125"/>
    <text class="tableName" x="155" y="34" text-anchor="middle">article_likes</text>
    <text class="field" x="18" y="66">PK: id</text>
    <text class="field" x="18" y="94">FK: article_id, user_id</text>
    <text class="field" x="18" y="118">unique(article_id,user_id)</text>
  </g>

  <!-- Dictionary tables -->
  <g transform="translate(1100 765)">
    <rect class="table" width="350" height="135"/>
    <text class="tableName" x="175" y="34" text-anchor="middle">herb_dictionary_entries</text>
    <text class="field" x="18" y="66">PK: id, FK: created_by</text>
    <text class="field" x="18" y="94">name, slug</text>
    <text class="field" x="18" y="122">status</text>
  </g>

  <g transform="translate(1535 705)">
    <rect class="table" width="310" height="125"/>
    <text class="tableName" x="155" y="34" text-anchor="middle">herb_dictionary_images</text>
    <text class="field" x="18" y="66">PK: id, FK: entry_id</text>
    <text class="field" x="18" y="94">image_path</text>
    <text class="field" x="18" y="118">sort_order</text>
  </g>

  <g transform="translate(1535 885)">
    <rect class="table" width="310" height="125"/>
    <text class="tableName" x="155" y="34" text-anchor="middle">herb_dictionary_favorites</text>
    <text class="field" x="18" y="66">PK: id</text>
    <text class="field" x="18" y="94">FK: user_id, entry_id</text>
    <text class="field" x="18" y="118">unique(user_id,entry_id)</text>
  </g>

  <!-- Contact table -->
  <g transform="translate(2135 285)">
    <rect class="table" width="360" height="160"/>
    <text class="tableName" x="180" y="34" text-anchor="middle">contact_messages</text>
    <text class="field" x="18" y="66">PK: id</text>
    <text class="field" x="18" y="94">name, phone, email</text>
    <text class="field" x="18" y="122">message</text>
    <text class="field" x="18" y="150">status</text>
  </g>

  <!-- Account relationships -->
  <path class="rel" d="M430 385 H270 V740"/>
  <text class="label" x="255" y="695">M-N User-Role</text>
  <path class="rel" d="M255 620 V740"/>
  <text class="label" x="275" y="700">1-N</text>

  <path class="rel" d="M530 385 H735 V740"/>
  <text class="label" x="620" y="695">M-N User-Permission</text>
  <path class="rel" d="M765 620 V740"/>
  <text class="label" x="785" y="700">1-N</text>

  <path class="rel" d="M255 620 H255 V987 H315"/>
  <text class="label" x="225" y="900">Role</text>
  <path class="rel" d="M765 620 H765 V987 H645"/>
  <text class="label" x="730" y="900">Permission</text>

  <!-- Content relationships -->
  <path class="rel" d="M1400 295 H1510"/>
  <text class="label" x="1428" y="275">1-N comments</text>
  <path class="rel" d="M1400 340 H1460 V440 H1510"/>
  <text class="label" x="1418" y="425">1-N likes</text>

  <path class="relSoft" d="M610 300 H1030 V325 H1100"/>
  <text class="label" x="860" y="300">users 1-N articles</text>
  <path class="relSoft" d="M610 320 H1005 V255 H1510"/>
  <text class="label" x="1080" y="240">users 1-N comments</text>
  <path class="relSoft" d="M610 340 H995 V455 H1510"/>
  <text class="label" x="1065" y="480">users 1-N article_likes</text>

  <!-- Dictionary relationships -->
  <path class="rel" d="M1450 815 H1535"/>
  <text class="label" x="1465" y="795">1-N images</text>
  <path class="rel" d="M1450 865 H1495 V945 H1535"/>
  <text class="label" x="1465" y="930">1-N favorites</text>

  <path class="relSoft" d="M610 355 H1010 V832 H1100"/>
  <text class="label" x="850" y="815">users 1-N created_by</text>
  <path class="relSoft" d="M610 370 H985 V965 H1535"/>
  <text class="label" x="960" y="990">users 1-N favorites</text>

  <!-- Contact note connector intentionally omitted: contact_messages has no user_id in current schema -->
  <text class="subtitle" x="2315" y="492" text-anchor="middle">Không có `user_id`; bảng liên hệ đứng độc lập</text>

  <!-- Note -->
  <rect class="noteBox" x="65" y="1225" width="2575" height="225"/>
  <text class="noteTitle" x="105" y="1268">Ghi chú dưới hình</text>
  <text class="noteText" x="105" y="1310">• Admin/Thầy thuốc chính có quyền quản lý toàn bộ nội dung và phân quyền.</text>
  <text class="noteText" x="105" y="1350">• Staff chỉ thao tác các chức năng được Admin cấp quyền.</text>
  <text class="noteText" x="105" y="1390">• User có thể xem bài viết, bình luận, lưu yêu thích dược liệu và gửi liên hệ.</text>
  <text class="noteText" x="105" y="1430">• Các bảng trong hình này phục vụ phần nội dung, tra cứu và quản trị quyền, không phải luồng điều trị chính.</text>

  <text class="caption" x="1500" y="1565" text-anchor="middle">Hình 2.9. Mô hình quan hệ dữ liệu phần nội dung, tra cứu và phân quyền của website quản lý nhà thuốc y học cổ truyền AmaTrung</text>
</svg>
