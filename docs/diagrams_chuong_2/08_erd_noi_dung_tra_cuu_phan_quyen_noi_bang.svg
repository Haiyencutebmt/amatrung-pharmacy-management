  <text class="note" x="60" y="1018">Ghi chú: các bảng model_has_roles, model_has_permissions và role_has_permissions là bảng trung gian phân quyền nhiều-nhiều.</text>
  <text class="note" x="60" y="1045">contact_messages đứng độc lập vì bảng hiện tại lưu liên hệ/yêu cầu hỗ trợ từ khách hoặc người dùng, không có khóa ngoại user_id.</text>
</svg>
