<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1080" viewBox="0 0 1900 1080" role="img" aria-labelledby="title desc">
  <title id="title">Hình 2.9. Mô hình quan hệ dữ liệu phần nội dung, tra cứu và phân quyền của website AmaTrung</title>
  <desc id="desc">Sơ đồ nối quan hệ giữa users, phân quyền, bài viết, bình luận, lượt thích, từ điển dược liệu và liên hệ.</desc>
  <rect width="1900" height="1080" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3657a5"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#14745f"/>
    </marker>
  </defs>

  <style>
    .figureTitle { font: 700 22px Arial, sans-serif; fill: #111827; }
    .groupTitle { font: 700 20px Arial, sans-serif; fill: #000000; }
    .tableBox { fill: #ffffff; stroke: #111827; stroke-width: 1.45; }
    .gridLine { stroke: #111827; stroke-width: 1.2; }
    .tableName { font: 700 18px Arial, sans-serif; fill: #000000; }
    .key { font: 700 15px Arial, sans-serif; fill: #000000; }
    .field { font: 400 18px Arial, sans-serif; fill: #000000; }
    .smallField { font: 400 16px Arial, sans-serif; fill: #000000; }
    .rel { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .relBlue { stroke: #3657a5; stroke-width: 2; fill: none; marker-end: url(#arrowBlue); }
    .relGreen { stroke: #14745f; stroke-width: 2; fill: none; marker-end: url(#arrowGreen); }
    .label { font: 700 14px Arial, sans-serif; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
    .note { font: 400 16px Arial, sans-serif; fill: #374151; }
  </style>

  <text class="figureTitle" x="950" y="34" text-anchor="middle">Hình 2.9. Mô hình quan hệ dữ liệu phần nội dung, tra cứu và phân quyền của website AmaTrung</text>
  <text class="groupTitle" x="170" y="76" text-anchor="middle">tài khoản và phân quyền</text>
  <text class="groupTitle" x="1080" y="76" text-anchor="middle">bài viết, bình luận và lượt thích</text>
  <text class="groupTitle" x="1070" y="552" text-anchor="middle">từ điển dược liệu</text>
  <text class="groupTitle" x="1755" y="76" text-anchor="middle">liên hệ/yêu cầu hỗ trợ</text>

  <!-- Quan hệ phân quyền -->
  <path class="relBlue" d="M230 220 L36 220 L36 598 L90 598"/>
  <text class="label" x="44" y="211">users 1-N</text>
  <path class="relBlue" d="M170 475 L170 515"/>
  <text class="label" x="181" y="502">roles 1-N</text>
  <path class="relBlue" d="M450 235 L790 235 L790 598 L750 598"/>
  <text class="label" x="612" y="224">users 1-N</text>
  <path class="relBlue" d="M580 475 L580 515"/>
  <text class="label" x="592" y="502">permissions 1-N</text>
  <path class="relBlue" d="M280 405 L350 405 L350 735 L250 830"/>
  <text class="label" x="358" y="522">roles 1-N</text>
  <path class="relBlue" d="M700 405 L790 405 L790 735 L530 830"/>
  <text class="label" x="798" y="522">permissions 1-N</text>

  <!-- Quan hệ nội dung -->
  <path class="rel" d="M450 175 L820 175"/>
  <text class="label" x="606" y="164">users 1-N articles</text>
  <path class="rel" d="M340 105 L340 86 L1120 86 L1120 155 L1160 155"/>
  <text class="label" x="740" y="80">users 1-N comments</text>
  <path class="rel" d="M450 270 L795 270 L795 395 L1140 395"/>
  <text class="label" x="650" y="259">users 1-N article_likes</text>
  <path class="rel" d="M1050 175 L1110 175 L1110 145 L1160 145"/>
  <text class="label" x="1072" y="134">articles 1-N</text>
  <path class="rel" d="M1050 280 L1100 280 L1100 382 L1140 382"/>
  <text class="label" x="1062" y="271">articles 1-N</text>

  <!-- Quan hệ từ điển dược liệu -->
  <path class="relGreen" d="M450 120 L780 120 L780 690 L850 690"/>
  <text class="label" x="606" y="109">users 1-N entries</text>
  <path class="relGreen" d="M1170 650 L1220 650 L1220 610 L1270 610"/>
  <text class="label" x="1190" y="600">entries 1-N images</text>
  <path class="relGreen" d="M1170 720 L1220 720 L1220 845 L1270 845"/>
  <text class="label" x="1190" y="736">entries 1-N favorites</text>
  <path class="relGreen" d="M450 295 L1600 295 L1600 845 L1590 845"/>
  <text class="label" x="690" y="286">users 1-N herb_dictionary_favorites</text>

  <!-- users -->
  <g transform="translate(230 105)">
    <rect class="tableBox" width="220" height="195"/>
    <line class="gridLine" x1="0" y1="32" x2="220" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="195"/>
    <line class="gridLine" x1="0" y1="64" x2="220" y2="64"/>
    <text class="tableName" x="110" y="23" text-anchor="middle">users</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="field" x="50" y="91">name</text>
    <text class="field" x="50" y="124">email</text>
    <text class="field" x="50" y="157">phone</text>
    <text class="field" x="50" y="190">role</text>
  </g>

  <!-- roles -->
  <g transform="translate(60 340)">
    <rect class="tableBox" width="220" height="135"/>
    <line class="gridLine" x1="0" y1="32" x2="220" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="135"/>
    <line class="gridLine" x1="0" y1="64" x2="220" y2="64"/>
    <text class="tableName" x="110" y="23" text-anchor="middle">roles</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="field" x="50" y="93">name</text>
    <text class="field" x="50" y="124">guard_name</text>
  </g>

  <!-- permissions -->
  <g transform="translate(460 340)">
    <rect class="tableBox" width="240" height="135"/>
    <line class="gridLine" x1="0" y1="32" x2="240" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="135"/>
    <line class="gridLine" x1="0" y1="64" x2="240" y2="64"/>
    <text class="tableName" x="120" y="23" text-anchor="middle">permissions</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="field" x="50" y="93">name</text>
    <text class="field" x="50" y="124">guard_name</text>
  </g>

  <!-- model_has_roles -->
  <g transform="translate(90 515)">
    <rect class="tableBox" width="260" height="165"/>
    <line class="gridLine" x1="0" y1="32" x2="260" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="165"/>
    <line class="gridLine" x1="0" y1="64" x2="260" y2="64"/>
    <text class="tableName" x="130" y="23" text-anchor="middle">model_has_roles</text>
    <text class="key" x="20" y="93" text-anchor="middle">FK</text>
    <text class="field" x="50" y="92">role_id</text>
    <text class="field" x="50" y="124">model_id</text>
    <text class="field" x="50" y="155">model_type</text>
  </g>

  <!-- model_has_permissions -->
  <g transform="translate(450 515)">
    <rect class="tableBox" width="300" height="165"/>
    <line class="gridLine" x1="0" y1="32" x2="300" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="165"/>
    <line class="gridLine" x1="0" y1="64" x2="300" y2="64"/>
    <text class="tableName" x="150" y="23" text-anchor="middle">model_has_permissions</text>
    <text class="key" x="20" y="93" text-anchor="middle">FK</text>
    <text class="field" x="50" y="92">permission_id</text>
    <text class="field" x="50" y="124">model_id</text>
    <text class="field" x="50" y="155">model_type</text>
  </g>

  <!-- role_has_permissions -->
  <g transform="translate(250 760)">
    <rect class="tableBox" width="280" height="145"/>
    <line class="gridLine" x1="0" y1="32" x2="280" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="145"/>
    <line class="gridLine" x1="0" y1="64" x2="280" y2="64"/>
    <text class="tableName" x="140" y="23" text-anchor="middle">role_has_permissions</text>
    <text class="key" x="20" y="93" text-anchor="middle">FK</text>
    <text class="field" x="50" y="92">role_id</text>
    <text class="key" x="20" y="125" text-anchor="middle">FK</text>
    <text class="field" x="50" y="124">permission_id</text>
  </g>

  <!-- articles -->
  <g transform="translate(820 120)">
    <rect class="tableBox" width="230" height="190"/>
    <line class="gridLine" x1="0" y1="32" x2="230" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="190"/>
    <line class="gridLine" x1="0" y1="64" x2="230" y2="64"/>
    <text class="tableName" x="115" y="23" text-anchor="middle">articles</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="key" x="20" y="91" text-anchor="middle">FK</text>
    <text class="field" x="50" y="91">user_id</text>
    <text class="field" x="50" y="124">title</text>
    <text class="field" x="50" y="157">slug</text>
    <text class="field" x="50" y="187">is_published</text>
  </g>

  <!-- comments -->
  <g transform="translate(1160 80)">
    <rect class="tableBox" width="250" height="190"/>
    <line class="gridLine" x1="0" y1="32" x2="250" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="190"/>
    <line class="gridLine" x1="0" y1="64" x2="250" y2="64"/>
    <text class="tableName" x="125" y="23" text-anchor="middle">comments</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="key" x="20" y="91" text-anchor="middle">FK</text>
    <text class="field" x="50" y="91">article_id</text>
    <text class="field" x="50" y="124">user_id</text>
    <text class="field" x="50" y="157">content</text>
    <text class="field" x="50" y="187">is_approved</text>
  </g>

  <!-- article_likes -->
  <g transform="translate(1140 310)">
    <rect class="tableBox" width="310" height="170"/>
    <line class="gridLine" x1="0" y1="32" x2="310" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="170"/>
    <line class="gridLine" x1="0" y1="64" x2="310" y2="64"/>
    <text class="tableName" x="155" y="23" text-anchor="middle">article_likes</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="key" x="20" y="91" text-anchor="middle">FK</text>
    <text class="field" x="50" y="91">article_id</text>
    <text class="field" x="50" y="124">user_id</text>
    <text class="smallField" x="50" y="156">unique(article_id,user_id)</text>
  </g>

  <!-- herb_dictionary_entries -->
  <g transform="translate(850 600)">
    <rect class="tableBox" width="320" height="190"/>
    <line class="gridLine" x1="0" y1="32" x2="320" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="190"/>
    <line class="gridLine" x1="0" y1="64" x2="320" y2="64"/>
    <text class="tableName" x="160" y="23" text-anchor="middle">herb_dictionary_entries</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="key" x="20" y="91" text-anchor="middle">FK</text>
    <text class="field" x="50" y="91">created_by</text>
    <text class="field" x="50" y="124">name</text>
    <text class="field" x="50" y="157">slug</text>
    <text class="field" x="50" y="187">status</text>
  </g>

  <!-- herb_dictionary_images -->
  <g transform="translate(1270 535)">
    <rect class="tableBox" width="300" height="160"/>
    <line class="gridLine" x1="0" y1="32" x2="300" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="160"/>
    <line class="gridLine" x1="0" y1="64" x2="300" y2="64"/>
    <text class="tableName" x="150" y="23" text-anchor="middle">herb_dictionary_images</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="key" x="20" y="91" text-anchor="middle">FK</text>
    <text class="field" x="50" y="91">entry_id</text>
    <text class="field" x="50" y="124">image_path</text>
    <text class="field" x="50" y="153">sort_order</text>
  </g>

  <!-- herb_dictionary_favorites -->
  <g transform="translate(1270 760)">
    <rect class="tableBox" width="320" height="170"/>
    <line class="gridLine" x1="0" y1="32" x2="320" y2="32"/>
    <line class="gridLine" x1="40" y1="32" x2="40" y2="170"/>
    <line class="gridLine" x1="0" y1="64" x2="320" y2="64"/>
    <text class="tableName" x="160" y="23" text-anchor="middle">herb_dictionary_favorites</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="key" x="20" y="91" text-anchor="middle">FK</text>
    <text class="field" x="50" y="91">user_id</text>
    <text class="field" x="50" y="124">entry_id</text>
    <text class="smallField" x="50" y="156">unique(entry_id,user_id)</text>
