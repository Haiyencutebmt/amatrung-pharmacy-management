    <text class="tableName" x="135" y="23" text-anchor="middle">contact_messages</text>
    <text class="key" x="20" y="55" text-anchor="middle">PK</text>
    <text class="field" x="50" y="55">id</text>
    <text class="field" x="50" y="91">name</text>
    <text class="field" x="50" y="124">phone</text>
    <text class="field" x="50" y="157">message</text>
    <text class="field" x="50" y="177">status</text>
