<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2150" viewBox="0 0 1500 2150" role="img" aria-labelledby="title desc">
  <title id="title">Hình 2. Sơ đồ hoạt động quy trình khám, lập đơn và cấp thuốc trong hệ thống AmaTrung</title>
  <desc id="desc">Flowchart mô tả quy trình tiếp nhận bệnh nhân, tạo bệnh án, dùng AI tham khảo, xác nhận chẩn đoán, lập đơn, kiểm kho, cấp thuốc và ghi nhận biến động kho.</desc>
  <rect width="1500" height="2150" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#cbd5e1" flood-opacity="0.65"/>
    </filter>
  </defs>

  <style>
    .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 19px Arial, sans-serif; fill: #475569; }
    .node { stroke-width: 2.2; filter: url(#softShadow); }
    .process { fill: #ffffff; stroke: #334155; }
    .admin { fill: #eff6ff; stroke: #2563eb; }
    .ai { fill: #fff7ed; stroke: #ea580c; }
    .stock { fill: #f0fdf4; stroke: #16a34a; }
    .warn { fill: #fef2f2; stroke: #dc2626; }
    .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.2; filter: url(#softShadow); }
    .terminal { fill: #111827; stroke: #111827; stroke-width: 2.2; filter: url(#softShadow); }
    .noteBox { fill: #f8fafc; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 8 6; rx: 12; }
    .nodeText { font: 700 18px Arial, sans-serif; fill: #0f172a; }
    .nodeTextSmall { font: 700 16px Arial, sans-serif; fill: #0f172a; }
    .terminalText { font: 700 18px Arial, sans-serif; fill: #ffffff; }
    .label { font: 700 15px Arial, sans-serif; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
    .noteText { font: 400 16px Arial, sans-serif; fill: #334155; }
    .noteTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
    .legendTitle { font: 700 17px Arial, sans-serif; fill: #0f172a; }
    .legendText { font: 400 15px Arial, sans-serif; fill: #334155; }
    .arrow { stroke: #1f2937; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
    .arrowSoft { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
  </style>

  <text class="title" x="750" y="48" text-anchor="middle">Hình 2. Sơ đồ hoạt động quy trình khám, lập đơn và cấp thuốc trong hệ thống AmaTrung</text>
  <text class="subtitle" x="750" y="82" text-anchor="middle">AI chỉ hỗ trợ tham khảo; chẩn đoán, lập đơn và cấp thuốc do Admin / Thầy thuốc chính quyết định</text>

  <!-- Legend -->
  <g transform="translate(1035 115)">
    <rect class="noteBox" width="395" height="155"/>
    <text class="legendTitle" x="20" y="30">Chú giải</text>
    <rect x="20" y="48" width="28" height="18" rx="5" fill="#eff6ff" stroke="#2563eb"/>
    <text class="legendText" x="60" y="63">Thao tác chuyên môn của Admin / Thầy thuốc chính</text>
    <rect x="20" y="76" width="28" height="18" rx="5" fill="#fff7ed" stroke="#ea580c"/>
    <text class="legendText" x="60" y="91">Bước AI hỗ trợ tham khảo</text>
    <rect x="20" y="104" width="28" height="18" rx="5" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="legendText" x="60" y="119">Bước kiểm kho, cấp thuốc, ghi nhận tồn kho</text>
    <rect x="20" y="132" width="28" height="18" rx="5" fill="#fef2f2" stroke="#dc2626"/>
    <text class="legendText" x="60" y="147">Cảnh báo hoặc tình huống không đủ điều kiện</text>
  </g>

  <!-- Main nodes -->
  <g id="start">
    <rect class="terminal" x="610" y="120" width="280" height="54" rx="27"/>
    <text class="terminalText" x="750" y="154" text-anchor="middle">Bắt đầu</text>
  </g>

  <g id="receive">
    <rect class="node process" x="540" y="210" width="420" height="66" rx="12"/>
    <text class="nodeText" x="750" y="237" text-anchor="middle">Tiếp nhận / tra cứu</text>
    <text class="nodeText" x="750" y="261" text-anchor="middle">bệnh nhân</text>
  </g>

  <g id="hasPatient">
    <polygon class="decision" points="750,315 950,375 750,435 550,375"/>
    <text class="nodeTextSmall" x="750" y="369" text-anchor="middle">Đã có hồ sơ</text>
    <text class="nodeTextSmall" x="750" y="392" text-anchor="middle">bệnh nhân?</text>
  </g>

  <g id="createPatient">
    <rect class="node process" x="160" y="342" width="300" height="66" rx="12"/>
    <text class="nodeText" x="310" y="369" text-anchor="middle">Thêm mới</text>
    <text class="nodeText" x="310" y="393" text-anchor="middle">bệnh nhân</text>
  </g>

  <g id="selectPatient">
    <rect class="node process" x="540" y="475" width="420" height="66" rx="12"/>
    <text class="nodeText" x="750" y="515" text-anchor="middle">Chọn hồ sơ bệnh nhân</text>
  </g>

  <g id="createRecord">
    <rect class="node admin" x="540" y="585" width="420" height="66" rx="12"/>
    <text class="nodeText" x="750" y="625" text-anchor="middle">Tạo hồ sơ bệnh án</text>
  </g>

  <g id="inputSymptoms">
    <rect class="node process" x="540" y="695" width="420" height="78" rx="12"/>
    <text class="nodeText" x="750" y="725" text-anchor="middle">Nhập triệu chứng và</text>
    <text class="nodeText" x="750" y="750" text-anchor="middle">thông tin khám ban đầu</text>
  </g>

  <g id="usePreAi">
    <polygon class="decision" points="750,825 1000,900 750,975 500,900"/>
    <text class="nodeTextSmall" x="750" y="892" text-anchor="middle">Có sử dụng AI</text>
    <text class="nodeTextSmall" x="750" y="915" text-anchor="middle">nhận định sơ bộ?</text>
  </g>

  <g id="manualDiagnosis">
    <rect class="node admin" x="110" y="875" width="360" height="78" rx="12"/>
    <text class="nodeText" x="290" y="904" text-anchor="middle">Admin / Thầy thuốc chính</text>
    <text class="nodeText" x="290" y="929" text-anchor="middle">tự nhập chẩn đoán</text>
  </g>

  <g id="preAi">
    <rect class="node ai" x="1040" y="862" width="390" height="104" rx="12"/>
    <text class="nodeText" x="1235" y="891" text-anchor="middle">AI trả về hướng nhận định</text>
    <text class="nodeText" x="1235" y="916" text-anchor="middle">và mức độ phù hợp</text>
    <text class="nodeText" x="1235" y="941" text-anchor="middle">tham khảo</text>
  </g>

  <g id="confirmDiagnosis">
    <rect class="node admin" x="540" y="1035" width="420" height="78" rx="12"/>
    <text class="nodeText" x="750" y="1064" text-anchor="middle">Admin / Thầy thuốc chính</text>
    <text class="nodeText" x="750" y="1089" text-anchor="middle">xác nhận chẩn đoán</text>
  </g>

  <g id="useTreatmentAi">
    <polygon class="decision" points="750,1165 1000,1240 750,1315 500,1240"/>
    <text class="nodeTextSmall" x="750" y="1232" text-anchor="middle">Có cần AI</text>
    <text class="nodeTextSmall" x="750" y="1255" text-anchor="middle">gợi ý điều trị?</text>
  </g>

  <g id="manualPrescription">
    <rect class="node admin" x="120" y="1210" width="350" height="70" rx="12"/>
    <text class="nodeText" x="295" y="1239" text-anchor="middle">Lập đơn điều trị</text>
    <text class="nodeText" x="295" y="1264" text-anchor="middle">thủ công</text>
  </g>

  <g id="treatmentAi">
    <rect class="node ai" x="1040" y="1195" width="390" height="100" rx="12"/>
    <text class="nodeText" x="1235" y="1224" text-anchor="middle">AI gợi ý dược liệu /</text>
    <text class="nodeText" x="1235" y="1249" text-anchor="middle">dịch vụ / theo dõi,</text>
    <text class="nodeText" x="1235" y="1274" text-anchor="middle">Admin xem xét</text>
  </g>

  <g id="makePrescription">
    <rect class="node admin" x="540" y="1365" width="420" height="66" rx="12"/>
    <text class="nodeText" x="750" y="1405" text-anchor="middle">Lập đơn điều trị</text>
  </g>

  <g id="affectStock">
    <polygon class="decision" points="750,1480 1000,1555 750,1630 500,1555"/>
    <text class="nodeTextSmall" x="750" y="1547" text-anchor="middle">Đơn có thuốc</text>
    <text class="nodeTextSmall" x="750" y="1570" text-anchor="middle">ảnh hưởng kho?</text>
  </g>

  <g id="savePrint">
    <rect class="node process" x="120" y="1518" width="350" height="74" rx="12"/>
    <text class="nodeText" x="295" y="1549" text-anchor="middle">Lưu đơn / in đơn</text>
    <text class="nodeText" x="295" y="1574" text-anchor="middle">không trừ kho</text>
  </g>

  <g id="checkStock">
    <rect class="node stock" x="1040" y="1520" width="390" height="70" rx="12"/>
    <text class="nodeText" x="1235" y="1549" text-anchor="middle">Kiểm tra tồn kho</text>
    <text class="nodeText" x="1235" y="1574" text-anchor="middle">theo lô</text>
  </g>

  <g id="enoughStock">
    <polygon class="decision" points="1235,1645 1415,1702 1235,1759 1055,1702"/>
    <text class="nodeTextSmall" x="1235" y="1696" text-anchor="middle">Đủ tồn kho?</text>
  </g>

  <g id="stockWarning">
    <rect class="node warn" x="790" y="1668" width="230" height="68" rx="12"/>
    <text class="nodeText" x="905" y="1696" text-anchor="middle">Cảnh báo</text>
    <text class="nodeText" x="905" y="1721" text-anchor="middle">thiếu kho</text>
  </g>

  <g id="confirmDispense">
    <rect class="node admin" x="1040" y="1812" width="390" height="70" rx="12"/>
    <text class="nodeText" x="1235" y="1841" text-anchor="middle">Xác nhận cấp thuốc</text>
    <text class="nodeText" x="1235" y="1866" text-anchor="middle">bởi người có quyền</text>
  </g>

  <g id="deductStock">
    <rect class="node stock" x="1040" y="1928" width="390" height="66" rx="12"/>
    <text class="nodeText" x="1235" y="1968" text-anchor="middle">Trừ kho theo lô</text>
  </g>

  <g id="stockMovement">
    <rect class="node stock" x="1040" y="2038" width="390" height="66" rx="12"/>
    <text class="nodeText" x="1235" y="2078" text-anchor="middle">Ghi nhận biến động kho</text>
  </g>

  <g id="finishSave">
    <rect class="node process" x="540" y="1918" width="420" height="72" rx="12"/>
    <text class="nodeText" x="750" y="1948" text-anchor="middle">Lưu kết quả</text>
    <text class="nodeText" x="750" y="1973" text-anchor="middle">và hoàn tất</text>
  </g>

  <g id="end">
    <rect class="terminal" x="610" y="2040" width="280" height="54" rx="27"/>
    <text class="terminalText" x="750" y="2074" text-anchor="middle">Kết thúc</text>
  </g>

  <!-- Notes -->
  <g transform="translate(70 1820)">
    <rect class="noteBox" width="390" height="190"/>
    <text class="noteTitle" x="20" y="34">Ghi chú nghiệp vụ</text>
    <text class="noteText" x="20" y="70">- AI chỉ hỗ trợ tham khảo.</text>
    <text class="noteText" x="20" y="104">- Chẩn đoán do Admin /</text>
    <text class="noteText" x="36" y="128">Thầy thuốc chính xác nhận.</text>
    <text class="noteText" x="20" y="162">- Chỉ khi xác nhận cấp thuốc</text>
    <text class="noteText" x="36" y="186">mới trừ kho theo lô.</text>
  </g>

  <!-- Arrows: top patient flow -->
  <path class="arrow" d="M750 174 L750 210"/>
  <path class="arrow" d="M750 276 L750 315"/>
  <path class="arrow" d="M550 375 L460 375"/>
  <text class="label" x="495" y="361" text-anchor="middle">Chưa có</text>
  <path class="arrow" d="M310 408 L310 508 L540 508"/>
  <path class="arrow" d="M750 435 L750 475"/>
  <text class="label" x="803" y="460">Đã có</text>
  <path class="arrow" d="M750 541 L750 585"/>
  <path class="arrow" d="M750 651 L750 695"/>
  <path class="arrow" d="M750 773 L750 825"/>

  <!-- Preliminary AI branch -->
  <path class="arrow" d="M500 900 L470 900"/>
  <text class="label" x="487" y="884" text-anchor="middle">Không</text>
  <path class="arrow" d="M290 953 L290 1074 L540 1074"/>
  <path class="arrow" d="M1000 900 L1040 900"/>
  <text class="label" x="1020" y="884" text-anchor="middle">Có</text>
  <path class="arrow" d="M1235 966 L1235 1074 L960 1074"/>

  <!-- Treatment AI branch -->
  <path class="arrow" d="M750 1113 L750 1165"/>
  <path class="arrow" d="M500 1240 L470 1240"/>
  <text class="label" x="487" y="1224" text-anchor="middle">Không</text>
  <path class="arrow" d="M295 1280 L295 1398 L540 1398"/>
  <path class="arrow" d="M1000 1240 L1040 1240"/>
  <text class="label" x="1020" y="1224" text-anchor="middle">Có</text>
  <path class="arrow" d="M1235 1295 L1235 1398 L960 1398"/>

  <!-- Stock branch -->
  <path class="arrow" d="M750 1431 L750 1480"/>
  <path class="arrow" d="M500 1555 L470 1555"/>
  <text class="label" x="487" y="1539" text-anchor="middle">Không</text>
  <path class="arrow" d="M295 1592 L295 1954 L540 1954"/>
  <path class="arrow" d="M1000 1555 L1040 1555"/>
  <text class="label" x="1020" y="1539" text-anchor="middle">Có</text>
  <path class="arrow" d="M1235 1590 L1235 1645"/>
  <path class="arrow" d="M1055 1702 L1020 1702"/>
  <text class="label" x="1038" y="1686" text-anchor="middle">Không đủ</text>
  <path class="arrow" d="M905 1736 L905 1850 L750 1850 L750 1918"/>
  <path class="arrow" d="M1235 1759 L1235 1812"/>
  <text class="label" x="1260" y="1788">Đủ</text>
  <path class="arrow" d="M1235 1882 L1235 1928"/>
  <path class="arrow" d="M1235 1994 L1235 2038"/>
  <path class="arrow" d="M1040 2071 L960 2071 L960 1954"/>
  <path class="arrow" d="M750 1990 L750 2040"/>

  <!-- Note links -->
  <path class="arrowSoft" d="M1080 960 L470 1860"/>
  <path class="arrowSoft" d="M555 1075 L460 1895"/>
  <path class="arrowSoft" d="M1040 1847 L460 1950"/>
</svg>
