  <path class="arrow" d="M328 506 L328 540"/>
  <path class="arrow" d="M328 614 L328 655"/>
  <path class="arrow" d="M328 765 L328 810"/>
  <text class="label" x="356" y="790">Có</text>
  <path class="arrow" d="M168 710 L110 710 L110 1024 L105 1024"/>
