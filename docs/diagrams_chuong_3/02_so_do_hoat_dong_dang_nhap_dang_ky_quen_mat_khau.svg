  <text class="label" x="500" y="252">Đăng nhập</text>
  <path class="arrow" d="M950 325 L950 448"/>
  <text class="label" x="980" y="366">Đăng ký</text>
  <path class="arrow" d="M1145 265 L1578 265 L1578 448"/>
  <text class="label" x="1375" y="252">Quên mật khẩu</text>

