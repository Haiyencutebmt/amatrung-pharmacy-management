  <path class="arrow" d="M490 1248 L460 1248 L460 1340"/>
  <text class="label" x="474" y="1232">Không</text>

  <!-- Register nodes -->
  <g transform="translate(770 448)">
    <rect class="node process" width="365" height="58" rx="12"/>
    <text class="nodeText" x="183" y="36" text-anchor="middle">Mở form đăng ký</text>
  </g>
  <g transform="translate(735 540)">
