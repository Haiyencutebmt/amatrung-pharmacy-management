<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1450" viewBox="0 0 1900 1450" role="img" aria-labelledby="title desc">
  <title id="title">Hình 2. Sơ đồ hoạt động đăng nhập, đăng ký và quên mật khẩu trong hệ thống AmaTrung</title>
  <desc id="desc">Sơ đồ gồm ba luồng: đăng nhập, đăng ký tài khoản và quên mật khẩu bằng OTP email.</desc>
  <rect width="1900" height="1450" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#cbd5e1" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 19px Arial, sans-serif; fill: #475569; }
    .lane { fill: #ffffff; stroke-width: 2.4; rx: 18; }
    .laneTitle { font: 700 22px Arial, sans-serif; fill: #0f172a; }
    .node { stroke-width: 2.1; filter: url(#shadow); }
    .process { fill: #ffffff; stroke: #334155; }
    .success { fill: #f0fdf4; stroke: #16a34a; }
    .warning { fill: #fef2f2; stroke: #dc2626; }
    .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.2; filter: url(#shadow); }
    .terminal { fill: #111827; stroke: #111827; stroke-width: 2.1; filter: url(#shadow); }
    .noteBox { fill: #f8fafc; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 8 6; rx: 12; }
    .nodeText { font: 700 16px Arial, sans-serif; fill: #0f172a; }
    .nodeTextSmall { font: 700 15px Arial, sans-serif; fill: #0f172a; }
    .terminalText { font: 700 17px Arial, sans-serif; fill: #ffffff; }
    .noteText { font: 400 15px Arial, sans-serif; fill: #334155; }
    .noteTitle { font: 700 17px Arial, sans-serif; fill: #0f172a; }
    .label { font: 700 14px Arial, sans-serif; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
    .arrow { stroke: #1f2937; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <text class="title" x="950" y="48" text-anchor="middle">Hình 2. Sơ đồ hoạt động đăng nhập, đăng ký và quên mật khẩu trong hệ thống AmaTrung</text>
  <text class="subtitle" x="950" y="82" text-anchor="middle">Ba luồng xác thực chính: đăng nhập, đăng ký tài khoản và đặt lại mật khẩu bằng OTP email</text>

  <!-- Start and selection -->
  <rect class="terminal" x="810" y="115" width="280" height="52" rx="26"/>
  <text class="terminalText" x="950" y="148" text-anchor="middle">Bắt đầu</text>

  <polygon class="decision" points="950,205 1145,265 950,325 755,265"/>
  <text class="nodeTextSmall" x="950" y="259" text-anchor="middle">Người dùng</text>
  <text class="nodeTextSmall" x="950" y="281" text-anchor="middle">chọn chức năng</text>

  <path class="arrow" d="M950 167 L950 205"/>

  <!-- Lanes -->
  <rect class="lane" x="55" y="370" width="545" height="900" fill="#eff6ff" stroke="#2563eb"/>
  <text class="laneTitle" x="328" y="410" text-anchor="middle">Luồng đăng nhập</text>

  <rect class="lane" x="680" y="370" width="545" height="900" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="laneTitle" x="953" y="410" text-anchor="middle">Luồng đăng ký</text>

  <rect class="lane" x="1305" y="370" width="545" height="900" fill="#fff7ed" stroke="#ea580c"/>
  <text class="laneTitle" x="1578" y="410" text-anchor="middle">Luồng quên mật khẩu bằng OTP</text>

