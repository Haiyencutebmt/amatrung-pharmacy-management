<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="2250" viewBox="0 0 1500 2250" role="img" aria-labelledby="title desc">
  <title id="title">Hình 2.x. Sơ đồ hoạt động AI hỗ trợ khám chữa bệnh trong hệ thống AmaTrung</title>
  <desc id="desc">Sơ đồ mô tả AI nhận định sơ bộ, AI gợi ý điều trị, nhật ký AI và bước xác nhận của Admin hoặc Thầy thuốc chính.</desc>
  <rect width="1500" height="2250" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#cbd5e1" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    .title { font: 700 32px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 19px Arial, sans-serif; fill: #475569; }
    .node { stroke-width: 2.2; filter: url(#shadow); }
    .process { fill: #ffffff; stroke: #334155; }
    .admin { fill: #eff6ff; stroke: #2563eb; }
    .ai { fill: #fff7ed; stroke: #ea580c; }
    .log { fill: #f8fafc; stroke: #64748b; }
    .warning { fill: #fef2f2; stroke: #dc2626; }
    .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.2; filter: url(#shadow); }
    .terminal { fill: #111827; stroke: #111827; stroke-width: 2.2; filter: url(#shadow); }
    .noteBox { fill: #f8fafc; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 8 6; rx: 12; }
    .nodeText { font: 700 18px Arial, sans-serif; fill: #0f172a; }
    .nodeTextSmall { font: 700 16px Arial, sans-serif; fill: #0f172a; }
    .terminalText { font: 700 18px Arial, sans-serif; fill: #ffffff; }
    .label { font: 700 15px Arial, sans-serif; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 6; stroke-linejoin: round; }
    .noteTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
    .noteText { font: 400 16px Arial, sans-serif; fill: #334155; }
    .arrow { stroke: #1f2937; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
  </style>

  <text class="title" x="750" y="48" text-anchor="middle">Hình 2.x. Sơ đồ hoạt động AI hỗ trợ khám chữa bệnh trong hệ thống AmaTrung</text>
  <text class="subtitle" x="750" y="82" text-anchor="middle">AI chỉ hỗ trợ tham khảo; chẩn đoán, lập đơn và điều trị do Admin / Thầy thuốc chính xác nhận</text>

  <!-- Notes -->
  <g transform="translate(1015 120)">
    <rect class="noteBox" width="400" height="150"/>
    <text class="noteTitle" x="20" y="32">Ghi chú</text>
    <text class="noteText" x="20" y="64">- AI không tự xác nhận chẩn đoán.</text>
    <text class="noteText" x="20" y="94">- AI không tự lập đơn điều trị.</text>
    <text class="noteText" x="20" y="124">- AI không tự trừ kho.</text>
  </g>

  <!-- Main flow -->
  <rect class="terminal" x="610" y="120" width="280" height="54" rx="27"/>
  <text class="terminalText" x="750" y="154" text-anchor="middle">Bắt đầu</text>

  <rect class="node process" x="540" y="210" width="420" height="64" rx="12"/>
  <text class="nodeText" x="750" y="250" text-anchor="middle">Mở hồ sơ bệnh án</text>

  <polygon class="decision" points="750,315 965,378 750,441 535,378"/>
  <text class="nodeTextSmall" x="750" y="372" text-anchor="middle">Người dùng có quyền</text>
  <text class="nodeTextSmall" x="750" y="394" text-anchor="middle">dùng AI?</text>

  <rect class="node warning" x="1060" y="340" width="320" height="76" rx="12"/>
  <text class="nodeText" x="1220" y="371" text-anchor="middle">Thông báo</text>
  <text class="nodeText" x="1220" y="396" text-anchor="middle">không đủ quyền</text>

  <rect class="node process" x="540" y="485" width="420" height="82" rx="12"/>
  <text class="nodeText" x="750" y="516" text-anchor="middle">Nhập / kiểm tra triệu chứng</text>
  <text class="nodeText" x="750" y="542" text-anchor="middle">và thông tin khám ban đầu</text>

  <polygon class="decision" points="750,615 990,690 750,765 510,690"/>
  <text class="nodeTextSmall" x="750" y="682" text-anchor="middle">Đã có chẩn đoán</text>
  <text class="nodeTextSmall" x="750" y="705" text-anchor="middle">chính thức?</text>

  <!-- Preliminary branch -->
  <text class="noteTitle" x="275" y="650" text-anchor="middle">Nhánh AI nhận định sơ bộ</text>

  <rect class="node ai" x="100" y="705" width="350" height="72" rx="12"/>
  <text class="nodeText" x="275" y="734" text-anchor="middle">AI nhận định sơ bộ</text>
  <text class="nodeText" x="275" y="758" text-anchor="middle">từ hồ sơ bệnh án</text>

  <rect class="node process" x="100" y="815" width="350" height="84" rx="12"/>
  <text class="nodeText" x="275" y="845" text-anchor="middle">Backend tạo ngữ cảnh</text>
  <text class="nodeText" x="275" y="870" text-anchor="middle">đã lọc dữ liệu nhạy cảm</text>

  <rect class="node ai" x="100" y="935" width="350" height="102" rx="12"/>
  <text class="nodeText" x="275" y="964" text-anchor="middle">AI trả về hướng nhận định,</text>
  <text class="nodeText" x="275" y="989" text-anchor="middle">mức độ phù hợp tham khảo</text>
  <text class="nodeText" x="275" y="1014" text-anchor="middle">và cảnh báo</text>

  <rect class="node log" x="100" y="1075" width="350" height="64" rx="12"/>
  <text class="nodeText" x="275" y="1115" text-anchor="middle">Ghi ai_suggestion_logs</text>

  <rect class="node admin" x="100" y="1175" width="350" height="82" rx="12"/>
  <text class="nodeText" x="275" y="1205" text-anchor="middle">Admin / Thầy thuốc chính</text>
  <text class="nodeText" x="275" y="1230" text-anchor="middle">xem xét kết quả AI</text>

  <polygon class="decision" points="275,1300 455,1360 275,1420 95,1360"/>
  <text class="nodeTextSmall" x="275" y="1354" text-anchor="middle">Áp dụng làm</text>
  <text class="nodeTextSmall" x="275" y="1375" text-anchor="middle">chẩn đoán?</text>

  <rect class="node admin" x="80" y="1470" width="390" height="78" rx="12"/>
  <text class="nodeText" x="275" y="1499" text-anchor="middle">Admin / Thầy thuốc chính</text>
  <text class="nodeText" x="275" y="1524" text-anchor="middle">nhập chẩn đoán thủ công</text>

  <rect class="node admin" x="540" y="1470" width="420" height="78" rx="12"/>
  <text class="nodeText" x="750" y="1499" text-anchor="middle">Cập nhật chẩn đoán</text>
  <text class="nodeText" x="750" y="1524" text-anchor="middle">được xác nhận</text>

  <!-- Treatment branch -->
  <polygon class="decision" points="750,1600 1000,1675 750,1750 500,1675"/>
  <text class="nodeTextSmall" x="750" y="1667" text-anchor="middle">Có cần AI</text>
  <text class="nodeTextSmall" x="750" y="1690" text-anchor="middle">gợi ý điều trị?</text>

  <rect class="node admin" x="105" y="1638" width="360" height="74" rx="12"/>
  <text class="nodeText" x="285" y="1668" text-anchor="middle">Lập đơn điều trị</text>
  <text class="nodeText" x="285" y="1693" text-anchor="middle">thủ công</text>

  <text class="noteTitle" x="1220" y="1590" text-anchor="middle">Nhánh AI gợi ý điều trị</text>

  <rect class="node ai" x="1040" y="1630" width="360" height="88" rx="12"/>
  <text class="nodeText" x="1220" y="1662" text-anchor="middle">Kiểm tra điều kiện:</text>
  <text class="nodeText" x="1220" y="1687" text-anchor="middle">có chẩn đoán, không chuyển viện</text>

  <rect class="node process" x="1040" y="1760" width="360" height="88" rx="12"/>
  <text class="nodeText" x="1220" y="1792" text-anchor="middle">Tạo ngữ cảnh lâm sàng</text>
  <text class="nodeText" x="1220" y="1817" text-anchor="middle">và tồn kho khả dụng</text>

  <rect class="node ai" x="1040" y="1890" width="360" height="88" rx="12"/>
  <text class="nodeText" x="1220" y="1922" text-anchor="middle">AI gợi ý dược liệu,</text>
  <text class="nodeText" x="1220" y="1947" text-anchor="middle">dịch vụ và theo dõi</text>

  <rect class="node log" x="1040" y="2020" width="360" height="64" rx="12"/>
  <text class="nodeText" x="1220" y="2060" text-anchor="middle">Ghi ai_suggestion_logs</text>

  <rect class="node admin" x="540" y="1818" width="420" height="78" rx="12"/>
  <text class="nodeText" x="750" y="1847" text-anchor="middle">Admin / Thầy thuốc chính</text>
  <text class="nodeText" x="750" y="1872" text-anchor="middle">xem xét, điều chỉnh</text>

  <rect class="node admin" x="540" y="1940" width="420" height="64" rx="12"/>
  <text class="nodeText" x="750" y="1980" text-anchor="middle">Lập đơn theo quyết định chuyên môn</text>

  <rect class="node process" x="540" y="2040" width="420" height="64" rx="12"/>
  <text class="nodeText" x="750" y="2080" text-anchor="middle">Lưu kết quả, không tự trừ kho</text>

  <!-- Arrows -->
  <path class="arrow" d="M750 174 L750 210"/>
  <path class="arrow" d="M750 274 L750 315"/>
  <path class="arrow" d="M965 378 L1060 378"/>
  <text class="label" x="1018" y="362" text-anchor="middle">Không</text>
  <path class="arrow" d="M1220 416 L1460 416 L1460 2187 L890 2187"/>
  <path class="arrow" d="M750 441 L750 485"/>
  <text class="label" x="780" y="465">Có</text>
  <path class="arrow" d="M750 567 L750 615"/>

  <path class="arrow" d="M510 690 L275 690 L275 705"/>
  <text class="label" x="405" y="672">Chưa có</text>
  <path class="arrow" d="M275 777 L275 815"/>
  <path class="arrow" d="M275 899 L275 935"/>
  <path class="arrow" d="M275 1037 L275 1075"/>
  <path class="arrow" d="M275 1139 L275 1175"/>
  <path class="arrow" d="M275 1257 L275 1300"/>
  <path class="arrow" d="M95 1360 L65 1360 L65 1509 L80 1509"/>
  <text class="label" x="88" y="1344">Không</text>
  <path class="arrow" d="M455 1360 L750 1360 L750 1470"/>
  <text class="label" x="520" y="1344">Có</text>
  <path class="arrow" d="M275 1548 L275 1585 L750 1585 L750 1600"/>

  <path class="arrow" d="M750 765 L1010 765 L1010 1675 L1000 1675"/>
  <text class="label" x="880" y="750">Đã có</text>
  <path class="arrow" d="M750 1548 L750 1600"/>
  <path class="arrow" d="M500 1675 L465 1675"/>
  <text class="label" x="484" y="1658">Không</text>
  <path class="arrow" d="M285 1712 L285 1857 L540 1857"/>
  <path class="arrow" d="M1000 1675 L1040 1675"/>
  <text class="label" x="1020" y="1658">Có</text>
  <path class="arrow" d="M1220 1718 L1220 1760"/>
  <path class="arrow" d="M1220 1848 L1220 1890"/>
  <path class="arrow" d="M1220 1978 L1220 2020"/>
  <path class="arrow" d="M1040 2052 L960 2052 L960 1857"/>
  <path class="arrow" d="M750 1896 L750 1940"/>
  <path class="arrow" d="M750 2004 L750 2040"/>
  <path class="arrow" d="M750 2104 L750 2160"/>

  <rect class="terminal" x="610" y="2160" width="280" height="54" rx="27"/>
  <text class="terminalText" x="750" y="2194" text-anchor="middle">Kết thúc</text>
</svg>
