<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1750" viewBox="0 0 1700 1750" role="img" aria-labelledby="title desc">
  <title id="title">Hình 2.x. Sơ đồ hoạt động quản lý nội dung và tra cứu dược liệu trong hệ thống AmaTrung</title>
  <desc id="desc">Sơ đồ mô tả quản lý bài viết, bình luận, lượt thích, từ điển dược liệu, hình ảnh và yêu thích dược liệu.</desc>
  <rect width="1700" height="1750" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#cbd5e1" flood-opacity="0.7"/>
    </filter>
  </defs>

  <style>
    .title { font: 700 31px Arial, sans-serif; fill: #0f172a; }
    .subtitle { font: 400 18px Arial, sans-serif; fill: #475569; }
    .lane { stroke-width: 2.3; rx: 18; }
    .laneTitle { font: 700 22px Arial, sans-serif; fill: #0f172a; }
    .node { stroke-width: 2.2; filter: url(#shadow); }
    .process { fill: #ffffff; stroke: #334155; }
    .admin { fill: #eff6ff; stroke: #2563eb; }
    .user { fill: #f0fdf4; stroke: #16a34a; }
    .warning { fill: #fef2f2; stroke: #dc2626; }
    .decision { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.2; filter: url(#shadow); }
    .terminal { fill: #111827; stroke: #111827; stroke-width: 2.2; filter: url(#shadow); }
    .noteBox { fill: #f8fafc; stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 8 6; rx: 12; }
    .nodeText { font: 700 17px Arial, sans-serif; fill: #0f172a; }
    .nodeTextSmall { font: 700 15px Arial, sans-serif; fill: #0f172a; }
    .terminalText { font: 700 18px Arial, sans-serif; fill: #ffffff; }
    .label { font: 700 14px Arial, sans-serif; fill: #111827; paint-order: stroke; stroke: #ffffff; stroke-width: 5; stroke-linejoin: round; }
    .noteTitle { font: 700 18px Arial, sans-serif; fill: #0f172a; }
    .noteText { font: 400 15px Arial, sans-serif; fill: #334155; }
    .arrow { stroke: #1f2937; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
  </style>

  <text class="title" x="850" y="48" text-anchor="middle">Hình 2.x. Sơ đồ hoạt động quản lý nội dung và tra cứu dược liệu trong hệ thống AmaTrung</text>
  <text class="subtitle" x="850" y="82" text-anchor="middle">Gộp luồng bài viết, bình luận, lượt thích, từ điển dược liệu, hình ảnh và yêu thích dược liệu</text>

  <rect class="terminal" x="710" y="115" width="280" height="54" rx="27"/>
  <text class="terminalText" x="850" y="149" text-anchor="middle">Bắt đầu</text>

  <polygon class="decision" points="850,205 1080,275 850,345 620,275"/>
  <text class="nodeTextSmall" x="850" y="268" text-anchor="middle">Người dùng</text>
  <text class="nodeTextSmall" x="850" y="290" text-anchor="middle">chọn chức năng</text>

  <rect class="lane" x="55" y="390" width="760" height="1040" fill="#eff6ff" stroke="#2563eb"/>
  <text class="laneTitle" x="435" y="430" text-anchor="middle">Bài viết, bình luận và lượt thích</text>

  <rect class="lane" x="885" y="390" width="760" height="1040" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="laneTitle" x="1265" y="430" text-anchor="middle">Từ điển dược liệu và yêu thích</text>

  <!-- Article lane -->
  <rect class="node admin" x="170" y="470" width="530" height="66" rx="12"/>
  <text class="nodeText" x="435" y="510" text-anchor="middle">Admin / Staff có quyền mở quản lý bài viết</text>

  <rect class="node admin" x="170" y="575" width="530" height="66" rx="12"/>
  <text class="nodeText" x="435" y="615" text-anchor="middle">Tạo / cập nhật bài viết</text>

  <polygon class="decision" points="435,685 615,745 435,805 255,745"/>
  <text class="nodeTextSmall" x="435" y="739" text-anchor="middle">Xuất bản</text>
  <text class="nodeTextSmall" x="435" y="760" text-anchor="middle">bài viết?</text>

  <rect class="node process" x="105" y="860" width="250" height="62" rx="12"/>
  <text class="nodeText" x="230" y="899" text-anchor="middle">Lưu nháp</text>

  <rect class="node process" x="515" y="860" width="250" height="62" rx="12"/>
  <text class="nodeText" x="640" y="899" text-anchor="middle">Công khai bài viết</text>

  <rect class="node user" x="515" y="970" width="250" height="62" rx="12"/>
  <text class="nodeText" x="640" y="1009" text-anchor="middle">Người dùng xem bài viết</text>

  <polygon class="decision" points="640,1080 810,1135 640,1190 470,1135"/>
  <text class="nodeTextSmall" x="640" y="1129" text-anchor="middle">Đã đăng nhập?</text>

  <rect class="node warning" x="325" y="1230" width="250" height="62" rx="12"/>
  <text class="nodeText" x="450" y="1269" text-anchor="middle">Đăng nhập để tương tác</text>

  <rect class="node user" x="595" y="1230" width="180" height="74" rx="12"/>
  <text class="nodeText" x="685" y="1259" text-anchor="middle">Bình luận</text>
  <text class="nodeText" x="685" y="1284" text-anchor="middle">hoặc thích</text>

  <polygon class="decision" points="685,1340 805,1385 685,1430 565,1385"/>
  <text class="nodeTextSmall" x="685" y="1379" text-anchor="middle">Cần duyệt</text>
  <text class="nodeTextSmall" x="685" y="1399" text-anchor="middle">bình luận?</text>

  <rect class="node admin" x="455" y="1480" width="220" height="62" rx="12"/>
  <text class="nodeText" x="565" y="1519" text-anchor="middle">Duyệt bình luận</text>

  <rect class="node process" x="220" y="1480" width="210" height="62" rx="12"/>
  <text class="nodeText" x="325" y="1507" text-anchor="middle">Hiển thị bình luận</text>
  <text class="nodeText" x="325" y="1530" text-anchor="middle">/ lượt thích</text>

  <!-- Herb dictionary lane -->
  <rect class="node admin" x="1000" y="470" width="530" height="66" rx="12"/>
  <text class="nodeText" x="1265" y="510" text-anchor="middle">Admin / Staff có quyền mở quản lý từ điển</text>

  <rect class="node admin" x="1000" y="575" width="530" height="66" rx="12"/>
  <text class="nodeText" x="1265" y="615" text-anchor="middle">Tạo / cập nhật mục dược liệu</text>

  <rect class="node admin" x="1000" y="680" width="530" height="78" rx="12"/>
  <text class="nodeText" x="1265" y="711" text-anchor="middle">Thêm hình ảnh, mô tả, công dụng</text>
  <text class="nodeText" x="1265" y="736" text-anchor="middle">và trạng thái hiển thị</text>

  <polygon class="decision" points="1265,805 1460,870 1265,935 1070,870"/>
  <text class="nodeTextSmall" x="1265" y="864" text-anchor="middle">Mục dược liệu</text>
  <text class="nodeTextSmall" x="1265" y="886" text-anchor="middle">được kích hoạt?</text>

  <rect class="node process" x="930" y="985" width="260" height="68" rx="12"/>
  <text class="nodeText" x="1060" y="1014" text-anchor="middle">Lưu nội bộ</text>
  <text class="nodeText" x="1060" y="1039" text-anchor="middle">/ chưa hiển thị</text>

  <rect class="node process" x="1345" y="985" width="250" height="68" rx="12"/>
  <text class="nodeText" x="1470" y="1026" text-anchor="middle">Công khai mục tra cứu</text>

  <rect class="node user" x="1345" y="1100" width="250" height="68" rx="12"/>
  <text class="nodeText" x="1470" y="1129" text-anchor="middle">Người dùng tra cứu</text>
  <text class="nodeText" x="1470" y="1154" text-anchor="middle">từ điển dược liệu</text>

  <polygon class="decision" points="1470,1210 1630,1265 1470,1320 1310,1265"/>
  <text class="nodeTextSmall" x="1470" y="1259" text-anchor="middle">Đã đăng nhập?</text>

  <rect class="node warning" x="1040" y="1350" width="250" height="62" rx="12"/>
  <text class="nodeText" x="1165" y="1389" text-anchor="middle">Đăng nhập để lưu yêu thích</text>

  <rect class="node user" x="1345" y="1350" width="250" height="62" rx="12"/>
  <text class="nodeText" x="1470" y="1377" text-anchor="middle">Thêm / bỏ yêu thích</text>
  <text class="nodeText" x="1470" y="1400" text-anchor="middle">dược liệu</text>

  <!-- Finish -->
  <rect class="node process" x="640" y="1600" width="420" height="66" rx="12"/>
  <text class="nodeText" x="850" y="1640" text-anchor="middle">Lưu kết quả xử lý</text>

  <rect class="terminal" x="710" y="1690" width="280" height="54" rx="27"/>
  <text class="terminalText" x="850" y="1724" text-anchor="middle">Kết thúc</text>

  <!-- Notes -->
  <g transform="translate(55 1575)">
    <rect class="noteBox" width="520" height="115"/>
    <text class="noteTitle" x="20" y="32">Ghi chú</text>
    <text class="noteText" x="20" y="62">Admin / Thầy thuốc chính quản lý toàn bộ nội dung.</text>
    <text class="noteText" x="20" y="88">Staff chỉ thao tác theo quyền được cấp.</text>
  </g>

  <g transform="translate(1125 1575)">
    <rect class="noteBox" width="520" height="115"/>
    <text class="noteTitle" x="20" y="32">Phạm vi</text>
    <text class="noteText" x="20" y="62">Nhóm chức năng này phục vụ nội dung và tra cứu.</text>
    <text class="noteText" x="20" y="88">Không phải luồng điều trị chính.</text>
  </g>

  <!-- Arrows -->
  <path class="arrow" d="M850 169 L850 205"/>
  <path class="arrow" d="M620 275 L435 275 L435 470"/>
  <text class="label" x="500" y="260">Quản lý bài viết</text>
  <path class="arrow" d="M1080 275 L1265 275 L1265 470"/>
  <text class="label" x="1190" y="260">Tra cứu dược liệu</text>

  <!-- Article arrows -->
  <path class="arrow" d="M435 536 L435 575"/>
  <path class="arrow" d="M435 641 L435 685"/>
  <path class="arrow" d="M255 745 L230 745 L230 860"/>
  <text class="label" x="244" y="730">Không</text>
  <path class="arrow" d="M615 745 L640 745 L640 860"/>
  <text class="label" x="625" y="730">Có</text>
  <path class="arrow" d="M640 922 L640 970"/>
  <path class="arrow" d="M640 1032 L640 1080"/>
  <path class="arrow" d="M470 1135 L450 1135 L450 1230"/>
  <text class="label" x="460" y="1120">Không</text>
  <path class="arrow" d="M450 1292 L450 1320 L640 1320 L640 1190"/>
  <path class="arrow" d="M640 1190 L685 1190 L685 1230"/>
  <text class="label" x="675" y="1214">Có</text>
  <path class="arrow" d="M685 1304 L685 1340"/>
  <path class="arrow" d="M805 1385 L820 1385 L820 1511 L675 1511"/>
  <text class="label" x="827" y="1370">Có</text>
  <path class="arrow" d="M565 1385 L325 1385 L325 1480"/>
  <text class="label" x="480" y="1370">Không</text>
  <path class="arrow" d="M565 1542 L565 1565 L850 1565 L850 1600"/>
  <path class="arrow" d="M325 1542 L325 1565 L850 1565"/>
  <path class="arrow" d="M230 922 L90 922 L90 1565 L640 1565"/>

  <!-- Herb arrows -->
  <path class="arrow" d="M1265 536 L1265 575"/>
  <path class="arrow" d="M1265 641 L1265 680"/>
  <path class="arrow" d="M1265 758 L1265 805"/>
  <path class="arrow" d="M1070 870 L1060 870 L1060 985"/>
  <text class="label" x="1075" y="855">Không</text>
  <path class="arrow" d="M1460 870 L1470 870 L1470 985"/>
  <text class="label" x="1465" y="855">Có</text>
  <path class="arrow" d="M1470 1053 L1470 1100"/>
  <path class="arrow" d="M1470 1168 L1470 1210"/>
  <path class="arrow" d="M1310 1265 L1165 1265 L1165 1350"/>
  <text class="label" x="1238" y="1250">Không</text>
  <path class="arrow" d="M1165 1412 L1165 1440 L1470 1440 L1470 1320"/>
  <path class="arrow" d="M1470 1320 L1470 1350"/>
  <text class="label" x="1502" y="1338">Có</text>
  <path class="arrow" d="M1470 1412 L1470 1565 L1060 1565 L1060 1633"/>
  <path class="arrow" d="M1060 1053 L1060 1565"/>

  <path class="arrow" d="M850 1666 L850 1690"/>
</svg>
